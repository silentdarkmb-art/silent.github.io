<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="Images/FinalLogo.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Searcher - BLOXBURST🔥</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=DM+Sans:wght@400;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #0b0e2a;
      color: #fff;
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      top: -150px; left: 50%;
      transform: translateX(-50%);
      width: 800px; height: 400px;
      background: radial-gradient(ellipse, rgba(125,92,255,0.15) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      max-width: 700px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }

    /* HEADER */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 36px;
    }

    .logo img { height: 52px; width: auto; }

    .back-btn {
      text-decoration: none;
      color: rgba(255,255,255,0.55);
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 999px;
      padding: 8px 16px;
      transition: all 0.2s;
    }
    .back-btn:hover { color: #fff; border-color: rgba(125,92,255,0.5); }

    /* HERO */
    .hero { text-align: center; margin-bottom: 32px; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(125,92,255,0.15);
      border: 1px solid rgba(125,92,255,0.35);
      border-radius: 999px;
      padding: 5px 14px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.12em;
      color: rgba(200,185,255,0.95);
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .badge::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #a78bfa;
      box-shadow: 0 0 8px #a78bfa;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,100% { box-shadow: 0 0 8px #a78bfa; }
      50% { box-shadow: 0 0 18px #a78bfa, 0 0 28px rgba(167,139,250,0.4); }
    }

    .hero h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: 50px;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 10px;
    }

    .hero h1 span { color: #48d279; }

    .hero p {
      font-size: 14px;
      color: rgba(255,255,255,0.55);
      line-height: 1.7;
    }

    /* SEARCH */
    .search-wrap {
      position: relative;
      margin-bottom: 24px;
    }

    .search-icon {
      position: absolute;
      left: 16px; top: 50%;
      transform: translateY(-50%);
      font-size: 15px;
      pointer-events: none;
    }

    #filterInput {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1.5px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      padding: 13px 44px 13px 44px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      color: #fff;
      outline: none;
      transition: all 0.25s;
    }

    #filterInput::placeholder { color: rgba(255,255,255,0.3); }
    #filterInput:focus {
      border-color: rgba(125,92,255,0.6);
      background: rgba(125,92,255,0.07);
      box-shadow: 0 0 0 3px rgba(125,92,255,0.12);
    }

    .clear-btn {
      position: absolute;
      right: 16px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: rgba(255,255,255,0.4);
      font-size: 14px;
      cursor: pointer;
      padding: 4px;
      display: none;
    }
    .clear-btn.show { display: block; }
    .clear-btn:hover { color: #fff; }

    /* COUNT */
    .count-label {
      font-size: 12px;
      font-weight: 800;
      color: rgba(255,255,255,0.4);
      margin-bottom: 14px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* ALPHABET SECTIONS */
    .alpha-section { margin-bottom: 28px; }

    .alpha-letter {
      font-family: 'Fredoka', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: rgba(167,139,250,0.9);
      padding-bottom: 8px;
      margin-bottom: 8px;
      border-bottom: 2px solid rgba(125,92,255,0.2);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .alpha-letter::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(125,92,255,0.15);
    }

    .alpha-games { display: flex; flex-direction: column; gap: 7px; }

    /* GAME ITEM */
    .game-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(21,26,77,0.7);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 13px 18px;
      cursor: pointer;
      transition: all 0.2s ease;
      gap: 14px;
    }

    .game-item:hover {
      background: rgba(125,92,255,0.12);
      border-color: rgba(125,92,255,0.45);
      transform: translateX(5px);
    }

    .game-item:hover .arrow { opacity: 1; color: #48d279; }

    .game-name {
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .game-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .search-label {
      font-size: 11px;
      font-weight: 700;
      color: rgba(72,210,121,0.75);
    }

    .arrow {
      font-size: 14px;
      opacity: 0.3;
      transition: all 0.2s;
    }

    /* FLAT LIST (used during search/filter) */
    #flatList { display: flex; flex-direction: column; gap: 7px; }

    /* EMPTY */
    #emptyMsg {
      display: none;
      text-align: center;
      padding: 50px 20px;
      color: rgba(255,255,255,0.4);
    }
    #emptyMsg .icon { font-size: 40px; margin-bottom: 12px; }

    /* LOADING */
    #loadingMsg {
      text-align: center;
      padding: 50px 20px;
      color: rgba(255,255,255,0.4);
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid rgba(125,92,255,0.2);
      border-top-color: #7d5cff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* TOAST */
    #toast {
      position: fixed;
      bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: rgba(21,26,77,0.97);
      border: 1px solid rgba(125,92,255,0.4);
      border-radius: 999px;
      padding: 10px 22px;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      backdrop-filter: blur(12px);
      transition: transform 0.28s ease;
      z-index: 999;
      pointer-events: none;
      white-space: nowrap;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 480px) {
      .hero h1 { font-size: 34px; }
      .search-label { display: none; }
    }
  </style>
</head>
<body>

<div class="page">

  <div class="header">
    <a href="index.html" class="logo">
      <img src="Images/FinalLogo.png" alt="BLOXBURST">
    </a>
    <a href="gamecode.html" class="back-btn">← Game Codes</a>
  </div>

  <div class="hero">
    <div class="badge">Auto A–Z • Always Updated</div>
    <h1>Code <span>Searcher</span> 🔍</h1>
    <p>Piliin ang game — automatic mag-open ng Google search sa new tab!</p>
  </div>

  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input id="filterInput" type="text" placeholder="Filter games..." autocomplete="off">
    <button class="clear-btn" id="clearBtn" type="button">✕</button>
  </div>

  <div class="count-label" id="countLabel"></div>

  <div id="loadingMsg">
    <div class="spinner"></div>
    <p>Loading games...</p>
  </div>

  <!-- A-Z grouped sections (default view) -->
  <div id="alphaView"></div>

  <!-- Flat list (shown when filtering) -->
  <div id="flatList" style="display:none;"></div>

  <div id="emptyMsg">
    <div class="icon">😕</div>
    <p>Walang nakitang game</p>
  </div>

</div>

<div id="toast"></div>

<script>
  const alphaView   = document.getElementById('alphaView');
  const flatList    = document.getElementById('flatList');
  const emptyMsg    = document.getElementById('emptyMsg');
  const loadingMsg  = document.getElementById('loadingMsg');
  const countLabel  = document.getElementById('countLabel');
  const filterInput = document.getElementById('filterInput');
  const clearBtn    = document.getElementById('clearBtn');
  const toast       = document.getElementById('toast');
  let allGames = [];
  let toastTimer;

  // ── TOAST ──
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  // ── OPEN GOOGLE ──
  function openGoogle(name) {
    const url = 'https://www.google.com/search?q=' + encodeURIComponent(name + ' Codes Roblox');
    window.open(url, '_blank');
    showToast('🔍 Searching: ' + name + ' Codes');
  }

  // ── BUILD A SINGLE GAME ITEM ──
  function makeItem(name) {
    const div = document.createElement('div');
    div.className = 'game-item';
    div.innerHTML = `
      <span class="game-name">${name}</span>
      <div class="game-right">
        <span class="search-label">Search Codes</span>
        <span class="arrow">➜</span>
      </div>
    `;
    div.addEventListener('click', () => openGoogle(name));
    return div;
  }

  // ── RENDER A–Z GROUPED (default) ──
  function renderAlpha(games) {
    alphaView.innerHTML = '';

    const groups = {};
    games.forEach(name => {
      const letter = /^[A-Za-z]/.test(name) ? name[0].toUpperCase() : '#';
      if (!groups[letter]) groups[letter] = [];
      groups[letter].push(name);
    });

    const letters = Object.keys(groups).sort((a, b) => {
      if (a === '#') return 1;
      if (b === '#') return -1;
      return a.localeCompare(b);
    });

    letters.forEach(letter => {
      const section = document.createElement('div');
      section.className = 'alpha-section';

      const head = document.createElement('div');
      head.className = 'alpha-letter';
      head.textContent = letter;
      section.appendChild(head);

      const gamesDiv = document.createElement('div');
      gamesDiv.className = 'alpha-games';
      groups[letter].forEach(name => gamesDiv.appendChild(makeItem(name)));
      section.appendChild(gamesDiv);

      alphaView.appendChild(section);
    });
  }

  // ── RENDER FLAT LIST (when filtering) ──
  function renderFlat(games) {
    flatList.innerHTML = '';
    games.forEach(name => flatList.appendChild(makeItem(name)));
  }

  // ── LOAD games.json ──
  async function loadGames() {
    try {
      const res  = await fetch('games.json', { cache: 'no-store' });
      const data = await res.json();

      allGames = data.map(g => g.name).sort((a, b) =>
        a.localeCompare(b, undefined, { sensitivity: 'base' })
      );

      loadingMsg.style.display = 'none';
      countLabel.textContent   = allGames.length + ' games — A to Z';

      renderAlpha(allGames);
      alphaView.style.display = '';

    } catch (e) {
      loadingMsg.innerHTML = `
        <div style="font-size:36px;margin-bottom:12px;">⚠️</div>
        <p style="color:rgba(255,100,100,0.8);">
          Hindi ma-load ang games.json<br>
          <small style="opacity:0.6;">Siguraduhing nasa parehong folder ito</small>
        </p>`;
    }
  }

  // ── FILTER ──
  filterInput.addEventListener('input', function () {
    const q = this.value.toLowerCase().trim();
    clearBtn.classList.toggle('show', q.length > 0);

    if (!q) {
      alphaView.style.display = '';
      flatList.style.display  = 'none';
      emptyMsg.style.display  = 'none';
      countLabel.textContent  = allGames.length + ' games — A to Z';
      return;
    }

    const filtered = allGames.filter(g => g.toLowerCase().includes(q));

    alphaView.style.display = 'none';

    if (!filtered.length) {
      flatList.style.display = 'none';
      emptyMsg.style.display = 'block';
      countLabel.textContent = '0 games found';
    } else {
      flatList.style.display = 'flex';
      emptyMsg.style.display = 'none';
      countLabel.textContent = filtered.length + ' game' + (filtered.length !== 1 ? 's' : '') + ' found';
      renderFlat(filtered);
    }
  });

  clearBtn.addEventListener('click', () => {
    filterInput.value = '';
    clearBtn.classList.remove('show');
    alphaView.style.display = '';
    flatList.style.display  = 'none';
    emptyMsg.style.display  = 'none';
    countLabel.textContent  = allGames.length + ' games — A to Z';
    filterInput.focus();
  });

  loadGames();
</script>

</body>
</html>
